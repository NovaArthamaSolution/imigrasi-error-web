<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
<![CDATA[

      @keyframes pulseNodeFast {
        0%, 100% { r: 3.5; opacity: 0.2; filter: drop-shadow(0 0 0px transparent); }
        50% { r: 7.5; opacity: 1; filter: drop-shadow(0 0 10px #38BDF8) drop-shadow(0 0 16px #FFFFFF); }
      }
      .node { animation: pulseNodeFast 1.9s ease-in-out infinite; transform-origin: center; }
      .node-2 { animation-delay: 0.45s; }
      .node-3 { animation-delay: 0.9s; }
      .node-4 { animation-delay: 1.35s; }
    
]]>
</style>
  </defs>

  <!-- Dotted Connection Lines -->
  <g stroke="#93C5FD" stroke-width="1.6" stroke-dasharray="3,4" opacity="0.65">
    <line x1="80" y1="80" x2="140" y2="130" />
    <line x1="140" y1="130" x2="230" y2="90" />
    <line x1="140" y1="130" x2="160" y2="230" />
    <line x1="160" y1="230" x2="250" y2="210" />
    <line x1="160" y1="230" x2="200" y2="350" />
    <line x1="200" y1="350" x2="120" y2="400" />
    <line x1="200" y1="350" x2="270" y2="420" />
  </g>

  <!-- Pulsing High-Contrast Data Nodes -->
  <g fill="#38BDF8">
    <circle cx="80" cy="80" r="5" class="node" />
    <circle cx="140" cy="130" r="7" class="node node-2" />
    <circle cx="230" cy="90" r="4.5" class="node node-3" />
    <circle cx="160" cy="230" r="7.5" class="node node-4" />
    <circle cx="250" cy="210" r="5" class="node node-2" />
    <circle cx="200" cy="350" r="7" class="node node-3" />
    <circle cx="120" cy="400" r="5" class="node" />
    <circle cx="270" cy="420" r="6" class="node node-4" />
  </g>
</svg>

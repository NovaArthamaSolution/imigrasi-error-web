<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <style>
<![CDATA[

      .booth-roof { fill: #335b8e; stroke: #1e3553; stroke-width: 4; stroke-linejoin: round; }
      .booth-roof-side { fill: #244166; stroke: #1e3553; stroke-width: 4; stroke-linejoin: round; }
      .booth-frame { fill: #eef4fb; stroke: #b8ccdf; stroke-width: 3.5; }
      .booth-glass-side { fill: #659ecf; fill-opacity: 0.85; }
      .booth-counter { fill: #1d3c63; stroke: #10243d; stroke-width: 4; stroke-linejoin: round; }
      .booth-counter-side { fill: #152d4b; stroke: #10243d; stroke-width: 4; }
      .booth-body { fill: #386eb2; stroke: #18355c; stroke-width: 4; }
      .booth-body-side { fill: #254a78; stroke: #18355c; stroke-width: 4; }
      
      .skin { fill: #f8c29d; stroke: #2d1d17; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .hair { fill: #1f2024; stroke: #121316; stroke-width: 3.5; stroke-linejoin: round; }
      .uniform { fill: #2b3a50; stroke: #131b26; stroke-width: 3.5; stroke-linejoin: round; }
      .gold { fill: #f3be29; stroke: #996e00; stroke-width: 1.5; }
      .gold-stripe { stroke: #f3be29; stroke-width: 2.5; stroke-linecap: round; }

      /* Natural Waving Hand Animation */
      .anim-arm-base {
        transform-origin: 205px 388px;
        animation: armSway 1.8s ease-in-out infinite;
      }
      .anim-forearm-hand {
        transform-origin: 156px 424px;
        animation: forearmShake 1.8s ease-in-out infinite;
      }
      .anim-blink {
        transform-origin: 255px 307px;
        animation: eyeBlink 3.8s infinite;
      }
      .anim-officer {
        transform-origin: 250px 480px;
        animation: bodyIdle 3.2s ease-in-out infinite;
      }

      @keyframes armSway {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-4deg); }
        70% { transform: rotate(3deg); }
      }

      @keyframes forearmShake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-12deg) translateY(-2px); }
        50% { transform: rotate(8deg) translateY(1px); }
        75% { transform: rotate(-8deg) translateY(-1px); }
      }

      @keyframes eyeBlink {
        0%, 90%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.1); }
      }

      @keyframes bodyIdle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
    
]]>
</style>

    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="booth-interior-bg">
    <polygon points="102,175 354,175 354,465 102,465" fill="#a4ceee"/>
    <polygon points="354,175 420,195 420,465 354,465" fill="#7baed6"/>
  </g>

  <!-- Officer inside Booth -->
  <g class="anim-officer">
    
    <!-- Torso Uniform Shirt -->
    <path class="uniform" d="M 190 395 L 185 495 L 330 495 L 338 410 L 290 375 L 215 375 Z"/>

    <!-- Tie & Collar -->
    <polygon points="248,382 262,382 268,475 255,486 242,475" fill="#131b26"/>
    <polygon points="212,374 244,400 254,378" class="uniform"/>
    <polygon points="296,374 266,400 256,378" class="uniform"/>

    <!-- Right Shoulder Epaulet (Viewer's Right) -->
    <polygon points="338,410 302,390 298,406 332,424" class="uniform"/>
    <path d="M 326 416 L 318 410 L 314 414" fill="none" stroke="#f3be29" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 318 410 L 310 404 L 306 408" fill="none" stroke="#f3be29" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pockets & Badges -->
    <rect x="200" y="435" width="28" height="24" rx="2" class="uniform"/>
    <rect x="202" y="420" width="24" height="6" rx="1.5" class="gold"/>
    <rect x="272" y="435" width="28" height="24" rx="2" class="uniform"/>
    <rect x="274" y="420" width="24" height="6" rx="1.5" class="gold"/>

    <!-- Officer Left Arm (Resting towards counter) -->
    <path class="uniform" d="M 336 412 L 358 466 L 325 480 L 298 474 L 308 435 Z"/>

    <!-- Animated Waving Right Arm (Viewer's Left) -->
    <g class="anim-arm-base">
      <path class="uniform" d="M 175 392 C 160 404 150 416 145 432 L 168 440 C 174 425 185 410 205 385 Z"/>
      
      <!-- Shoulder Epaulet -->
      <polygon points="172,392 205,370 212,386 178,406" class="uniform"/>
      <path d="M 184 396 L 192 390 L 197 394" fill="none" stroke="#f3be29" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 194 390 L 202 384 L 207 388" fill="none" stroke="#f3be29" stroke-width="2.5" stroke-linecap="round"/>

      <g class="anim-forearm-hand">
        <!-- Sleeve Forearm -->
        <path class="uniform" d="M 145 432 L 118 360 L 138 350 L 168 438 Z"/>
        <path d="M 118 360 L 138 350" stroke="#131b26" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Correctly Oriented Waving Hand (Palm forward, thumb inside towards officer body) -->
        <g id="correct-orientation-hand">
          <path class="skin" d="
            M 120 354
            C 112 352 104 344 100 334
            C 94 322 92 304 98 298
            C 104 292 108 304 110 316
            C 108 302 110 282 120 280
            C 128 278 130 294 130 310
            C 132 296 136 280 144 280
            C 152 280 152 298 148 316
            C 152 306 156 292 162 296
            C 168 300 166 316 160 328
            C 166 332 174 340 168 348
            C 162 354 148 352 138 350
            Z
          "/>
          <!-- Palm Crease Lines -->
          <path d="M 110 316 C 112 328 116 338 118 346" fill="none" stroke="#2d1d17" stroke-width="2" stroke-linecap="round"/>
          <path d="M 130 310 C 130 324 132 336 132 344" fill="none" stroke="#2d1d17" stroke-width="2" stroke-linecap="round"/>
          <path d="M 148 316 C 146 326 142 336 140 344" fill="none" stroke="#2d1d17" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Neck -->
    <rect x="238" y="345" width="34" height="28" class="skin"/>

    <!-- Officer Head, Expressive Face & Official Service Cap -->
    <g id="officer-head">
      <circle cx="192" cy="308" r="14" class="skin"/>
      <circle cx="315" cy="310" r="13" class="skin"/>

      <!-- Face -->
      <path class="skin" d="M 198 280 Q 254 255 310 280 C 322 325 304 370 256 370 C 208 370 188 325 198 280 Z"/>

      <!-- Blushes -->
      <circle cx="212" cy="326" r="8" fill="#f19989" opacity="0.65"/>
      <circle cx="298" cy="328" r="8" fill="#f19989" opacity="0.65"/>

      <!-- Animated Eyes -->
      <g class="anim-blink">
        <ellipse cx="228" cy="306" rx="6.5" ry="9" fill="#1b1c20"/>
        <ellipse cx="282" cy="307" rx="6.5" ry="9" fill="#1b1c20"/>
        <circle cx="230" cy="302" r="2.8" fill="#ffffff"/>
        <circle cx="284" cy="303" r="2.8" fill="#ffffff"/>
      </g>

      <!-- Friendly Eyebrows -->
      <path d="M 214 290 Q 228 280 242 288" fill="none" stroke="#1b1c20" stroke-width="4" stroke-linecap="round"/>
      <path d="M 268 290 Q 282 280 296 288" fill="none" stroke="#1b1c20" stroke-width="4" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M 255 308 Q 258 318 250 320" fill="none" stroke="#d58b68" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Friendly Smile -->
      <path d="M 234 332 Q 255 334 276 330 C 276 356 234 356 234 332 Z" fill="#9e2a2b" stroke="#2d1d17" stroke-width="2.5"/>
      <path d="M 240 348 Q 255 340 270 346" fill="#f19989"/>
      <path d="M 236 333 Q 255 338 273 331" fill="#ffffff"/>

      <!-- Hair -->
      <path class="hair" d="M 192 295 C 190 270 204 250 254 250 C 304 250 318 270 315 300 C 308 300 300 280 276 278 C 246 275 220 288 192 295 Z"/>

      <!-- Official Indonesian Immigration Service Cap (Pet PDH) -->
      <g id="service-cap">
        <path class="uniform" d="M 194 265 C 188 215 220 180 255 180 C 290 180 322 215 316 265 Z"/>
        <path d="M 190 265 C 218 248 292 248 320 265 L 316 275 C 292 258 218 258 190 275 Z" fill="#131b26"/>
        <path d="M 186 268 C 216 244 294 244 324 270 C 294 294 216 294 186 268 Z" fill="#131b26" stroke="#0b1017" stroke-width="2"/>
        <path d="M 194 263 Q 255 246 316 265" fill="none" stroke="#f3be29" stroke-width="4" stroke-linecap="round"/>

        <g transform="translate(255, 224) scale(0.75)">
          <path d="M 0 -18 C -14 -18, -22 -4, -20 8 C -12 6, -6 2, 0 8 C 6 2, 12 6, 20 8 C 22 -4, 14 -18, 0 -18 Z" class="gold"/>
          <path d="M 0 -18 Q 4 -22 6 -16 Q 2 -14 0 -18 Z" fill="#f3be29"/>
          <path d="M -7 -6 L 7 -6 L 7 2 C 7 7, 0 10, 0 10 C 0 10, -7 7, -7 2 Z" fill="#b71c1c" stroke="#131b26" stroke-width="1.2"/>
          <path d="M 0 -6 L 7 -6 L 7 2 C 7 7, 0 10, 0 10 Z" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Booth Structure & Counter Foreground -->
  <g id="booth-foreground">
    
    <rect x="125" y="175" width="215" height="290" fill="url(#glass-reflection)"/>
    <polygon points="345,180 405,200 405,465 345,465" class="booth-glass-side"/>

    <rect x="102" y="175" width="24" height="295" class="booth-frame"/>
    <rect x="330" y="175" width="24" height="295" class="booth-frame"/>
    <polygon points="354,175 374,180 374,475 354,470" fill="#bccfe3"/>
    <polygon points="405,195 420,200 420,475 405,475" class="booth-frame"/>

    <polygon points="75,105 375,105 442,130 142,130" class="booth-roof"/>
    <polygon points="75,105 375,105 375,175 75,175" class="booth-roof"/>
    <polygon points="375,105 442,130 442,195 375,175" class="booth-roof-side"/>

    <polygon points="90,465 375,465 375,490 90,490" class="booth-counter"/>
    <polygon points="375,465 432,472 432,496 375,490" class="booth-counter-side"/>

    <!-- Left Hand Resting on Counter Desk -->
    <g id="counter-hand">
      <path class="skin" d="M 292 482 C 290 464, 326 464, 324 482 Z"/>
      <line x1="302" y1="468" x2="302" y2="480" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="312" y1="468" x2="312" y2="480" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <polygon points="95,490 370,490 370,660 95,660" class="booth-body"/>
    
    <polygon points="370,490 425,496 425,640 370,660" class="booth-body-side"/>

    <text x="232" y="582" 
          font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" 
          font-size="34" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="2" 
          text-anchor="middle">IMIGRASI</text>
  </g>
</svg>

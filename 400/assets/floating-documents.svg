<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Floating Documents -->
    <filter id="docShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F2444" flood-opacity="0.14"/>
    </filter>

    <!-- Document Gold Stamp Gradient -->
    <linearGradient id="stampGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Visa Card Gradient -->
    <linearGradient id="visaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>

    <!-- Arrival Card Gradient -->
    <linearGradient id="arrivalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
  </defs>

  <style>
<![CDATA[

  
    /* 1. Upper-Left: Floating Document Sheet above Officer (2x faster: 2.2s) */
    .anim-doc-left {
      animation: floatDocL 2.2s ease-in-out infinite alternate;
      transform-origin: 440px 60px;
    }
    @keyframes floatDocL {
      0% { transform: translateY(0px) rotate(-10deg); }
      100% { transform: translateY(-16px) rotate(-4deg); }
    }

    /* 2. Mid-Sky: VISA APPROVED Stamp Card (Shifted leftward away from globe) */
    .anim-visa-card {
      animation: floatVisaCard 2.4s ease-in-out infinite alternate 0.3s;
      transform-origin: 880px 50px;
    }
    @keyframes floatVisaCard {
      0% { transform: translateY(0px) rotate(-12deg); }
      100% { transform: translateY(-18px) rotate(-6deg); }
    }

    /* 3. Mid-Right: IMMIGRATION ARRIVAL INDONESIA Card (Shifted leftward away from globe) */
    .anim-arrival-card {
      animation: floatArrivalCard 2.5s ease-in-out infinite alternate 0.6s;
      transform-origin: 1100px 60px;
    }
    @keyframes floatArrivalCard {
      0% { transform: translateY(0px) rotate(10deg); }
      100% { transform: translateY(-16px) rotate(4deg); }
    }

    /* 4. Comic ??? Above Passport (2x faster: 1.4s) */
    .anim-passport-q {
      animation: floatPassportQ 1.4s ease-in-out infinite alternate;
      transform-origin: 1380px 140px;
    }
    @keyframes floatPassportQ {
      0% { transform: translateY(0px) scale(0.95); opacity: 0.85; }
      100% { transform: translateY(-14px) scale(1.1); opacity: 1; }
    }

    /* Ambient Sparkles */
    .anim-sparkle {
      animation: sparklePulse 1.8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes sparklePulse {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  
  
]]>
</style>

  <!-- 1. UPPER-LEFT DOCUMENT (Above Officer - Scaled & Positioned Higher Up) -->
  <g class="anim-doc-left">
    <g transform="translate(370, 5) scale(1.28)" filter="url(#docShadow)">
      <rect x="0" y="0" width="88" height="114" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" />
      <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 80 0 C 84.5 0 88 3.5 88 8 L 88 17 L 0 17 Z" fill="#3B82F6" />
      <circle cx="10" cy="8.5" r="2.5" fill="#FFFFFF" opacity="0.9" />
      <rect x="18" y="6.5" width="32" height="4" rx="2" fill="#FFFFFF" opacity="0.9" />

      <!-- Document Content Lines -->
      <g opacity="0.55">
        <line x1="12" y1="30" x2="72" y2="30" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
        <line x1="12" y1="41" x2="62" y2="41" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="51" x2="68" y2="51" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="61" x2="54" y2="61" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="71" x2="44" y2="71" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Small Gold Medallion Seal -->
      <circle cx="60" cy="88" r="13" fill="url(#stampGold)" stroke="#B45309" stroke-width="1.2" />
      <path d="M 55 88 L 59 92 L 66 85" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- 2. MID-SKY: VISA APPROVED Stamp Card (Shifted leftward away from globe) -->
  <g class="anim-visa-card">
    <g transform="translate(770, 12) scale(1.24)" filter="url(#docShadow)">
      <rect x="0" y="0" width="130" height="72" rx="10" fill="url(#visaBg)" stroke="#C084FC" stroke-width="1.6" stroke-dasharray="5 3" />
      
      <!-- Purple Stamp Border & Text -->
      <rect x="8" y="8" width="114" height="56" rx="6" fill="none" stroke="#9333EA" stroke-width="1.4" stroke-dasharray="4 2" opacity="0.75" />
      
      <g transform="translate(16, 20)">
        <text x="0" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#7E22CE" letter-spacing="1">✈ VISA</text>
        <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#9333EA" letter-spacing="1.5">APPROVED</text>
        <!-- Mini checkmark -->
        <circle cx="82" cy="20" r="10" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.2" />
        <path d="M 77 20 L 81 24 L 87 17" stroke="#7E22CE" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>

  <!-- 3. MID-RIGHT: IMMIGRATION ARRIVAL INDONESIA Card (Shifted leftward away from globe) -->
  <g class="anim-arrival-card">
    <g transform="translate(980, 20) scale(1.22)" filter="url(#docShadow)">
      <rect x="0" y="0" width="126" height="78" rx="8" fill="url(#arrivalBg)" stroke="#86EFAC" stroke-width="1.6" />
      <rect x="6" y="6" width="114" height="66" rx="5" fill="none" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.8" />
      
      <g transform="translate(15, 16)">
        <text x="48" y="11" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#15803D" text-anchor="middle" letter-spacing="0.8">IMMIGRATION</text>
        <text x="48" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#16A34A" text-anchor="middle" letter-spacing="0.5">✈ ARRIVAL ✈</text>
        <text x="48" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#15803D" text-anchor="middle" letter-spacing="0.8">INDONESIA</text>
        
        <!-- Mini Barcode -->
        <g transform="translate(16, 42)" stroke="#15803D" stroke-width="1.2">
          <line x1="0" y1="0" x2="0" y2="8" />
          <line x1="4" y1="0" x2="4" y2="8" stroke-width="2.2" />
          <line x1="8" y1="0" x2="8" y2="8" />
          <line x1="12" y1="0" x2="12" y2="8" stroke-width="1.8" />
          <line x1="18" y1="0" x2="18" y2="8" />
          <line x1="22" y1="0" x2="22" y2="8" stroke-width="2.4" />
          <line x1="28" y1="0" x2="28" y2="8" />
        </g>
      </g>
    </g>
  </g>

  <!-- Sky Plus (+) & Sparkle Symbols Matching Reference Image -->
  <!-- Left sky plus -->
  <g class="anim-sparkle" transform="translate(520, 40)" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round">
    <line x1="-6" y1="0" x2="6" y2="0" />
    <line x1="0" y1="-6" x2="0" y2="6" />
  </g>
  <!-- Center sky diamond -->
  <g class="anim-sparkle" transform="translate(730, 25)">
    <path d="M 0 -8 Q 0 0 -8 0 Q 0 0 0 8 Q 0 0 8 0 Q 0 0 0 -8 Z" fill="#93C5FD" opacity="0.8" />
  </g>
  <!-- Right sky plus -->
  <g class="anim-sparkle" transform="translate(1150, 18)" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round">
    <line x1="-6" y1="0" x2="6" y2="0" />
    <line x1="0" y1="-6" x2="0" y2="6" />
  </g>
</svg>

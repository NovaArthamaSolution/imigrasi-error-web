<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <!-- Plane Fuselage Gradient -->
    <linearGradient id="planeBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Wing Top Gradient -->
    <linearGradient id="planeWingTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Wing Bottom Gradient -->
    <linearGradient id="planeWingBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Soft Plane Shadow -->
    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
<![CDATA[

  
    /* Marching Dashes on Flight Path */
    .flight-path-dashed {
      stroke-dasharray: 8 8;
      animation: dashMarch 1.2s linear infinite;
    }
    @keyframes dashMarch {
      from { stroke-dashoffset: 16; }
      to { stroke-dashoffset: 0; }
    }
  
  
]]>
</style>

  <!-- Dashed Flight Path Curve Across the Sky (Matching Reference Image) -->
  <path class="flight-path-dashed"
        d="M -60 260 C 140 140, 320 45, 520 45 C 720 45, 880 120, 1080 120 C 1260 120, 1440 65, 1660 10" 
        stroke="#60A5FA" 
        stroke-width="2.6" 
        fill="none" 
        opacity="0.85" />

  <!-- Animated Airplane Gliding Along the Exact Flightpath Curve -->
  <g filter="url(#planeShadow)">
    <g>
      <!-- animateMotion tracks the flightpath path exactly with auto rotation -->
      <animateMotion 
        path="M -60 260 C 140 140, 320 45, 520 45 C 720 45, 880 120, 1080 120 C 1260 120, 1440 65, 1660 10" 
        dur="11s" 
        repeatCount="indefinite" 
        rotate="auto" />

      <!-- Airplane Graphics (Aligned to +X axis / Facing Right) -->
      <g transform="scale(0.85)">
        
        <!-- Left Wing (Upper Side in perspective) -->
        <polygon points="-8,-4 -28,-36 -12,-36 12,-4" fill="url(#planeWingTop)" stroke="#1D4ED8" stroke-width="0.8" />
        <!-- Left Engine Pod -->
        <ellipse cx="-4" cy="-18" rx="7" ry="3.5" fill="#1E293B" />
        <ellipse cx="2" cy="-18" rx="2.5" ry="3.5" fill="#93C5FD" />

        <!-- Right Wing (Lower Side in perspective) -->
        <polygon points="-8,4 -28,36 -12,36 12,4" fill="url(#planeWingBot)" stroke="#0F172A" stroke-width="0.8" />
        <!-- Right Engine Pod -->
        <ellipse cx="-4" cy="18" rx="7" ry="3.5" fill="#0F172A" />
        <ellipse cx="2" cy="18" rx="2.5" ry="3.5" fill="#60A5FA" />

        <!-- Horizontal Stabilizers (Tail Wings) -->
        <polygon points="-30,-2 -44,-16 -38,-16 -24,-2" fill="url(#planeWingTop)" />
        <polygon points="-30,2 -44,16 -38,16 -24,2" fill="url(#planeWingBot)" />

        <!-- Vertical Tail Fin -->
        <polygon points="-28,0 -42,-14 -34,-14 -20,0" fill="#2563EB" stroke="#1D4ED8" stroke-width="0.8" />
        <!-- Gold Crest on Tail Fin -->
        <circle cx="-34" cy="-8" r="2" fill="#FBBF24" />

        <!-- Main Fuselage Body (Sleek Jet Tube) -->
        <path d="M 38 0 
                 C 32 -6, 12 -7, -24 -7 
                 C -34 -7, -42 -4, -44 0 
                 C -42 4, -34 7, -24 7 
                 C 12 7, 32 6, 38 0 Z" 
              fill="url(#planeBodyGrad)" stroke="#1D4ED8" stroke-width="1" />

        <!-- Cockpit Windshield (Glass Reflection) -->
        <path d="M 28 -4 C 32 -2, 34 0, 32 2 L 26 3 C 24 1, 24 -1, 26 -3 Z" fill="#FFFFFF" opacity="0.9" />
        <path d="M 22 -5 L 26 -4 L 25 0 L 21 0 Z" fill="#93C5FD" opacity="0.8" />

        <!-- Passenger Windows Strip -->
        <g fill="#EFF6FF" opacity="0.8">
          <circle cx="16" cy="-2" r="1" />
          <circle cx="11" cy="-2" r="1" />
          <circle cx="6" cy="-2" r="1" />
          <circle cx="1" cy="-2" r="1" />
          <circle cx="-4" cy="-2" r="1" />
          <circle cx="-9" cy="-2" r="1" />
          <circle cx="-14" cy="-2" r="1" />
          <circle cx="-19" cy="-2" r="1" />
        </g>

        <!-- Wingtip Strobes (Red & Green Nav Lights) -->
        <circle cx="-20" cy="-36" r="1.5" fill="#EF4444" />
        <circle cx="-20" cy="36" r="1.5" fill="#22C55E" />
      </g>
    </g>
  </g>
</svg>

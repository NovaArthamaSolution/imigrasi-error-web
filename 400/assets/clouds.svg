<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Cloud Glow -->
    <filter id="cloudGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#93C5FD" flood-opacity="0.18"/>
    </filter>

    <!-- Subtle Cloud Under-Belly Gradient (Gives 3D Volume) -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Distant Hazy Cloud Gradient -->
    <linearGradient id="distantCloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
<![CDATA[

  
    /* 1. Near Foreground Clouds (Fastest Parallax Drift) */
    .drift-near-1 {
      animation: driftNearA 14s ease-in-out infinite alternate;
    }
    @keyframes driftNearA {
      0% { transform: translateX(0px) translateY(0px); }
      100% { transform: translateX(35px) translateY(-5px); }
    }

    .drift-near-2 {
      animation: driftNearB 16s ease-in-out infinite alternate;
    }
    @keyframes driftNearB {
      0% { transform: translateX(0px) translateY(0px); }
      100% { transform: translateX(-30px) translateY(4px); }
    }

    /* 2. Midground Clouds (Moderate Parallax Drift) */
    .drift-mid-1 {
      animation: driftMidA 20s ease-in-out infinite alternate;
    }
    @keyframes driftMidA {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-24px); }
    }

    .drift-mid-2 {
      animation: driftMidB 22s ease-in-out infinite alternate;
    }
    @keyframes driftMidB {
      0% { transform: translateX(0px); }
      100% { transform: translateX(28px); }
    }

    /* 3. Distant Background Clouds (Slow Subtle Drift) */
    .drift-far-1 {
      animation: driftFarA 28s ease-in-out infinite alternate;
    }
    @keyframes driftFarA {
      0% { transform: translateX(0px); }
      100% { transform: translateX(18px); }
    }

    .drift-far-2 {
      animation: driftFarB 32s ease-in-out infinite alternate;
    }
    @keyframes driftFarB {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-16px); }
    }
  
  
]]>
</style>

  <!-- ==========================================
       LAYER 1: DISTANT BACKGROUND CLOUDS (FAR & SMALL)
       ========================================== -->
  <g class="drift-far-1" opacity="0.55">
    <!-- Far Small Cloud 1 (Left Sky) -->
    <path d="M 60 140 
             C 60 125, 75 115, 90 115 
             C 96 100, 114 90, 130 90 
             C 152 90, 170 106, 174 126 
             C 185 128, 194 136, 194 148 
             C 194 160, 184 170, 172 170 
             L 80 170 
             C 65 170, 56 158, 60 140 Z" 
          fill="url(#distantCloudGrad)" />

    <!-- Far Tiny Cloud 2 (Mid-Left Sky) -->
    <path d="M 520 80 
             C 520 70, 530 62, 542 62 
             C 548 50, 562 44, 575 44 
             C 592 44, 606 56, 610 72 
             C 618 74, 626 80, 626 90 
             C 626 100, 618 108, 608 108 
             L 535 108 
             C 524 108 518 98 520 80 Z" 
          fill="url(#distantCloudGrad)" />

    <!-- Far Small Cloud 3 (Mid-Right Sky) -->
    <path d="M 1120 70 
             C 1120 58, 1132 50, 1146 50 
             C 1152 38, 1168 30, 1184 30 
             C 1205 30, 1222 45, 1226 62 
             C 1236 64, 1245 72, 1245 82 
             C 1245 94, 1235 102, 1224 102 
             L 1138 102 
             C 1125 102 1118 92 1120 70 Z" 
          fill="url(#distantCloudGrad)" />
  </g>

  <g class="drift-far-2" opacity="0.48">
    <!-- Far Tiny Cloud 4 (Center Horizon) -->
    <path d="M 780 45 
             C 780 36, 790 28, 800 28 
             C 805 18, 818 12, 830 12 
             C 846 12, 858 24, 862 38 
             C 870 40, 878 46, 878 54 
             C 878 64, 870 70, 860 70 
             L 792 70 
             C 782 70 778 60 780 45 Z" 
          fill="url(#distantCloudGrad)" />

    <!-- Far Tiny Cloud 5 (Far Right) -->
    <path d="M 1460 110 
             C 1460 100, 1470 92, 1482 92 
             C 1488 82, 1500 76, 1512 76 
             C 1528 76, 1540 88, 1544 102 
             C 1552 104, 1560 110, 1560 118 
             C 1560 128, 1552 134, 1542 134 
             L 1475 134 
             C 1465 134 1458 125 1460 110 Z" 
          fill="url(#distantCloudGrad)" />
  </g>


  <!-- ==========================================
       LAYER 2: MIDGROUND CLOUDS (MEDIUM SIZE & FLUFFY)
       ========================================== -->
  <g class="drift-mid-1" opacity="0.8">
    <!-- Mid Cloud 1 (Above Left Content) -->
    <path d="M 280 90 
             C 280 70, 298 56, 320 56 
             C 328 38, 350 26, 372 26 
             C 402 26, 428 48, 432 76 
             C 446 78, 460 90, 460 108 
             C 460 126, 444 140, 426 140 
             L 308 140 
             C 288 140 274 124 278 104 C 276 98 280 90 280 90 Z" 
          fill="url(#cloudGrad)" filter="url(#cloudGlow)" />

    <!-- Mid Cloud 2 (Center Sky) -->
    <path d="M 680 100 
             C 680 82, 696 68, 716 68 
             C 724 52, 742 42, 762 42 
             C 790 42, 814 62, 818 88 
             C 830 90, 842 102, 842 116 
             C 842 132, 828 144, 812 144 
             L 704 144 
             C 686 144 674 130 678 112 Z" 
          fill="url(#cloudGrad)" filter="url(#cloudGlow)" />
  </g>

  <g class="drift-mid-2" opacity="0.75">
    <!-- Mid Cloud 3 (Right Mid Sky) -->
    <path d="M 1240 75 
             C 1240 58, 1255 45, 1274 45 
             C 1282 30, 1300 20, 1320 20 
             C 1346 20, 1368 40, 1372 65 
             C 1384 68, 1396 78, 1396 92 
             C 1396 108, 1382 118, 1366 118 
             L 1264 118 
             C 1248 118 1236 104 1240 88 Z" 
          fill="url(#cloudGrad)" filter="url(#cloudGlow)" />
  </g>


  <!-- ==========================================
       LAYER 3: FOREGROUND CLOUDS (LARGE, CRISP, NEAR)
       ========================================== -->
  <!-- Grand Fluffy Cloud Left (Near & Large) -->
  <g class="drift-near-1">
    <path d="M 110 70 
             C 110 44, 134 25, 162 25 
             C 174 4, 202 -10, 232 -10 
             C 272 -10, 305 18, 312 55 
             C 332 58, 350 75, 350 98 
             C 350 122, 330 140, 305 140 
             L 145 140 
             C 118 140 98 120 102 94 
             C 100 85 110 70 110 70 Z" 
          fill="url(#cloudGrad)" filter="url(#cloudGlow)" />
  </g>

  <!-- Grand Fluffy Cloud Right (Near & Large) -->
  <g class="drift-near-2">
    <path d="M 920 60 
             C 920 36, 942 18, 970 18 
             C 980 -2, 1008 -15, 1038 -15 
             C 1076 -15, 1108 12, 1116 48 
             C 1135 50, 1152 66, 1152 88 
             C 1152 112, 1132 130, 1108 130 
             L 955 130 
             C 930 130 910 110 914 86 
             C 912 76 920 60 920 60 Z" 
          fill="url(#cloudGrad)" filter="url(#cloudGlow)" />
  </g>
</svg>

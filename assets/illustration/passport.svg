<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <style>
<![CDATA[

      .base-shadow { fill: #2c3e55; opacity: 0.22; filter: blur(5px); }

      .anim-passport {
        transform-origin: 200px 220px;
        animation: floatScan 4s ease-in-out infinite;
      }
      .anim-scan-ray {
        animation: scanBeam 4s ease-in-out infinite;
      }

      @keyframes floatScan {
        0%, 100% { transform: translateY(0px) scale(1); }
        35% { transform: translateY(-16px) scale(1.04); }
        55% { transform: translateY(-16px) scale(1.04); }
        80% { transform: translateY(0px) scale(1); }
      }

      @keyframes scanBeam {
        0%, 25%, 75%, 100% { opacity: 0; transform: translateY(-40px); }
        35%, 55% { opacity: 0.85; transform: translateY(60px); }
      }
    
]]>
</style>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="standalonePassportClip">
      <rect x="120" y="110" width="160" height="214" rx="8" />
    </clipPath>
  </defs>

  <ellipse cx="200" cy="420" rx="100" ry="16" class="base-shadow"/>

  <g class="anim-passport">
    <!-- 3D Visible Paper Pages Side/Top Edge -->
    <path d="M 116 112 C 160 105, 240 105, 284 112 L 284 326 C 240 319, 160 319, 116 326 Z" fill="#F0F4F8" stroke="#CBD5E1" stroke-width="1" />

    <!-- Passport Drop Shadow -->
    <rect x="118" y="112" width="164" height="216" rx="8" fill="#091424" opacity="0.25" />

    <!-- Passport Real Image Cover -->
    <image href="passport.png" x="120" y="110" width="160" height="214" preserveAspectRatio="none" clip-path="url(#standalonePassportClip)" />

    <!-- Protective Border & Spine Highlight Reflection -->
    <rect x="120" y="110" width="160" height="214" rx="8" fill="none" stroke="#0D1B33" stroke-width="1.8" opacity="0.6" />
    <line x1="125" y1="110" x2="125" y2="324" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />

    <!-- Green Laser Scanning Line Overlay -->
    <g class="anim-scan-ray">
      <rect x="90" y="120" width="220" height="30" fill="url(#laser-grad)"/>
      <line x1="80" y1="135" x2="320" y2="135" stroke="#4ade80" stroke-width="2.5" filter="drop-shadow(0 0 4px #22c55e)"/>
    </g>
  </g>
</svg>

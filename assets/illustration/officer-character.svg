<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <style>
<![CDATA[

      /* Unified Indonesian Immigration Officer Palette (Official Navy & Gold) */
      .skin { fill: #f8c29d; stroke: #2d1d17; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .skin-shadow { fill: #e5a782; }
      .hair { fill: #1f2024; stroke: #121316; stroke-width: 3.5; stroke-linejoin: round; }
      .uniform-navy { fill: #2b3a50; stroke: #131b26; stroke-width: 3.5; stroke-linejoin: round; }
      .uniform-dark { fill: #1f2937; stroke: #111827; stroke-width: 3.5; stroke-linejoin: round; }
      .uniform-pants { fill: #1a2332; stroke: #0f1520; stroke-width: 3.5; stroke-linejoin: round; }
      .uniform-belt { fill: #111827; stroke: #0b0f19; stroke-width: 3; }
      .gold-accent { fill: #f3be29; stroke: #996e00; stroke-width: 1.5; }
      .gold-stripe { stroke: #f3be29; stroke-width: 2.5; stroke-linecap: round; }
      .tie { fill: #131b26; stroke: #090e15; stroke-width: 2.5; }
      .shoe { fill: #151b24; stroke: #0a0d12; stroke-width: 3.5; }

      /* Animations */
      .anim-body-idle {
        transform-origin: 250px 480px;
        animation: bodyBreathe 3.2s ease-in-out infinite;
      }
      .anim-scratch-arm {
        transform-origin: 194px 254px;
        animation: scratchHeadAnim 2.4s ease-in-out infinite;
      }
      .anim-blink {
        transform-origin: 250px 182px;
        animation: eyeBlink 3.8s infinite;
      }
      .anim-question {
        transform-origin: 348px 90px;
        animation: questionFloat 2.4s ease-in-out infinite;
      }
      .anim-sweat {
        transform-origin: 185px 150px;
        animation: sweatDrip 2.4s ease-in-out infinite;
      }
      .anim-scratch-spark {
        transform-origin: 180px 115px;
        animation: scratchSpark 2.4s ease-in-out infinite;
      }

      @keyframes scratchHeadAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-7deg) translateY(-2px); }
        50% { transform: rotate(4deg) translateY(2px); }
        75% { transform: rotate(-8deg) translateY(-3px); }
      }

      @keyframes eyeBlink {
        0%, 90%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.1); }
      }

      @keyframes bodyBreathe {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-3px) scale(1.008, 1.012); }
      }

      @keyframes questionFloat {
        0%, 100% { opacity: 0.2; transform: translateY(6px) scale(0.9); }
        40%, 75% { opacity: 1; transform: translateY(-8px) scale(1.1); }
        90% { opacity: 0; transform: translateY(-16px) scale(0.95); }
      }

      @keyframes sweatDrip {
        0%, 100% { opacity: 0; transform: translateY(-4px) scale(0.7); }
        35%, 70% { opacity: 0.95; transform: translateY(4px) scale(1.05); }
        85% { opacity: 0; transform: translateY(10px) scale(0.8); }
      }

      @keyframes scratchSpark {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        30%, 70% { opacity: 1; transform: scale(1.1); }
        90% { opacity: 0.1; }
      }
    
]]>
</style>
  </defs>

  <!-- Confused Effect: Golden Question Mark & Drops -->
  <g class="anim-question">
    <path d="M 332 75 C 332 52, 366 52, 366 72 C 366 88, 348 94, 348 108" fill="none" stroke="#f3be29" stroke-width="6" stroke-linecap="round"/>
    <circle cx="348" cy="122" r="4.5" fill="#f3be29"/>
    <path d="M 376 60 L 386 52" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 383 72 L 395 72" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Sweat Drop on Side of Head -->
  <g class="anim-sweat">
    <path d="M 185 142 C 180 142, 175 148, 175 154 C 175 160, 185 166, 185 166 C 185 166, 195 160, 195 154 C 195 148, 190 142, 185 142 Z" fill="#60a5fa" opacity="0.9"/>
  </g>

  <!-- Scratch Spark Marks -->
  <g class="anim-scratch-spark" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 166 112 C 160 118, 160 126, 165 132"/>
    <path d="M 174 107 C 167 116, 168 128, 175 136"/>
  </g>

  <!-- Ground Shadow under Officer -->
  <ellipse cx="250" cy="625" rx="88" ry="13" fill="#091424" opacity="0.25"/>

  <!-- Character Entire Animated Body (Single Cohesive Hierarchy) -->
  <g class="anim-body-idle">

    <!-- Lower Body: Pants & Shoes (Solid, Balanced Proportions) -->
    <g id="lower-body">
      <!-- Pants -->
      <path class="uniform-pants" d="M 198 385 L 188 580 L 236 580 L 246 415 L 254 415 L 264 580 L 312 580 L 302 385 Z"/>
      <!-- Gold Side Lampasse / Piping Stripes -->
      <line x1="198" y1="385" x2="188" y2="580" stroke="#f3be29" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="302" y1="385" x2="312" y2="580" stroke="#f3be29" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Crease lines -->
      <line x1="212" y1="410" x2="208" y2="565" stroke="#0f1520" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="288" y1="410" x2="292" y2="565" stroke="#0f1520" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Polished Service Shoes -->
      <g id="shoes">
        <!-- Left Shoe -->
        <path class="shoe" d="M 182 580 C 182 568, 238 568, 238 580 L 240 600 C 230 608, 176 608, 176 598 Z"/>
        <path d="M 185 596 C 200 590, 225 590, 235 596" stroke="#475569" stroke-width="2" fill="none" opacity="0.6"/>

        <!-- Right Shoe -->
        <path class="shoe" d="M 262 580 C 262 568, 318 568, 318 580 L 324 598 C 324 608, 270 608, 260 600 Z"/>
        <path d="M 265 596 C 275 590, 300 590, 315 596" stroke="#475569" stroke-width="2" fill="none" opacity="0.6"/>
      </g>
    </g>

    <!-- Torso: Official Navy Uniform Shirt, Epaulets, Badges & Tie -->
    <g id="torso">
      <!-- Main Shirt Body -->
      <path class="uniform-navy" d="M 188 252 L 312 252 L 322 388 L 178 388 Z"/>

      <!-- Uniform Belt & Golden Buckle -->
      <rect x="178" y="372" width="144" height="20" class="uniform-belt"/>
      <rect x="234" y="367" width="32" height="30" rx="4" class="gold-accent"/>
      <rect x="242" y="375" width="16" height="14" rx="2" fill="#996e00"/>

      <!-- Chest Pockets & Badges -->
      <!-- Left Pocket (Viewer's Left) with Wings Badge -->
      <rect x="194" y="300" width="38" height="36" rx="3" class="uniform-navy"/>
      <path d="M 194 300 Q 213 310 232 300" fill="none" stroke="#131b26" stroke-width="2.5"/>
      <rect x="198" y="288" width="30" height="7" rx="1.5" class="gold-accent"/>
      <circle cx="213" cy="318" r="4.5" class="gold-accent"/>

      <!-- Right Pocket (Viewer's Right) with Name Plate -->
      <rect x="268" y="300" width="38" height="36" rx="3" class="uniform-navy"/>
      <path d="M 268 300 Q 287 310 306 300" fill="none" stroke="#131b26" stroke-width="2.5"/>
      <rect x="272" y="288" width="30" height="7" rx="1.5" fill="#111827" stroke="#f3be29" stroke-width="1.2"/>
      <line x1="276" y1="291.5" x2="298" y2="291.5" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Official Black Tie with Golden Tie-Bar Clip -->
      <polygon points="245,268 255,268 262,360 250,374 238,360" class="tie"/>
      <rect x="242" y="318" width="18" height="5" rx="1.2" class="gold-accent"/>

      <!-- Left Resting Arm (Hand on Hip) -->
      <g id="left-resting-arm">
        <path class="uniform-navy" d="M 308 254 L 358 322 L 320 376 L 302 360 L 332 320 L 298 274 Z"/>
        <!-- Shoulder Epaulet (Rank Marks) -->
        <polygon points="304,252 342,264 336,280 298,266" class="uniform-navy"/>
        <line x1="308" y1="258" x2="332" y2="266" class="gold-stripe"/>
        <line x1="306" y1="264" x2="330" y2="272" class="gold-stripe"/>
        <line x1="304" y1="270" x2="328" y2="278" class="gold-stripe"/>
        <!-- Hand on Hip -->
        <path class="skin" d="M 314 366 C 304 372, 310 392, 324 384 C 328 380, 326 370, 314 366 Z"/>
      </g>

      <!-- Shirt Collar -->
      <polygon points="208,252 238,278 248,254" class="uniform-navy"/>
      <polygon points="292,252 262,278 252,254" class="uniform-navy"/>

      <!-- Neck -->
      <path class="skin" d="M 234,212 L 266,212 L 268,258 L 232,258 Z"/>
    </g>

    <!-- Officer Head, Expressive Face & Official Service Cap -->
    <g id="head-group">
      <!-- Ears -->
      <circle cx="198" cy="188" r="14" class="skin"/>
      <path d="M 196 182 Q 202 188 196 194" fill="none" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>

      <circle cx="302" cy="188" r="14" class="skin"/>
      <path d="M 304 182 Q 298 188 304 194" fill="none" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Face Shape -->
      <path class="skin" d="M 204 165 Q 250 145 296 165 C 304 206 290 236 250 236 C 210 236 196 206 204 165 Z"/>

      <!-- Soft Cheek Blushes -->
      <circle cx="216" cy="198" r="7.5" fill="#f19989" opacity="0.6"/>
      <circle cx="284" cy="198" r="7.5" fill="#f19989" opacity="0.6"/>

      <!-- Eyes (Animated Blink) -->
      <g class="anim-blink">
        <ellipse cx="232" cy="182" rx="6.5" ry="8.5" fill="#1b1c20"/>
        <ellipse cx="268" cy="182" rx="6.5" ry="8.5" fill="#1b1c20"/>
        <circle cx="234" cy="178" r="2.8" fill="#ffffff"/>
        <circle cx="270" cy="178" r="2.8" fill="#ffffff"/>
      </g>

      <!-- Confused/Curious Eyebrows -->
      <path d="M 220 168 Q 232 160 244 170" fill="none" stroke="#1b1c20" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 256 172 Q 268 158 280 164" fill="none" stroke="#1b1c20" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M 252 182 Q 256 192 247 194" fill="none" stroke="#d58b68" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Open Friendly/Puzzled Smile -->
      <path d="M 234 206 Q 250 208 266 206 C 266 222 234 222 234 206 Z" fill="#9e2a2b" stroke="#2d1d17" stroke-width="2.5"/>
      <path d="M 237 207 Q 250 211 263 207" fill="#ffffff"/>
      <path d="M 242 218 Q 250 214 258 218" fill="#f19989"/>

      <!-- Hair Base Trim -->
      <path class="hair" d="M 198 178 C 196 155 208 140 250 140 C 292 140 304 155 302 178 C 295 178 288 162 268 160 C 242 158 220 168 198 178 Z"/>

      <!-- Official Indonesian Immigration Service Cap (Pet PDH Imigrasi) -->
      <g id="service-cap">
        <!-- Cap Crown / Body -->
        <path class="uniform-navy" d="M 198 152 C 192 98 224 64 250 64 C 276 64 308 98 302 152 Z"/>
        <!-- Cap Black Band -->
        <path d="M 194 152 C 220 136 280 136 306 152 L 302 162 C 280 146 220 146 194 162 Z" fill="#131b26"/>
        <!-- Cap Visor (Black Shiny Brim) -->
        <path d="M 190 155 C 218 132 282 132 310 157 C 282 178 218 178 190 155 Z" fill="#131b26" stroke="#0b1017" stroke-width="2"/>
        <!-- Golden Decorative Chin Strap Cord -->
        <path d="M 196 150 Q 250 135 304 150" fill="none" stroke="#f3be29" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Garuda/Immigration Gold Emblem on Cap (Bhumi Pura Wira Wibawa) -->
        <g transform="translate(250, 108) scale(0.72)">
          <path d="M 0 -18 C -14 -18, -22 -4, -20 8 C -12 6, -6 2, 0 8 C 6 2, 12 6, 20 8 C 22 -4, 14 -18, 0 -18 Z" class="gold-accent"/>
          <path d="M 0 -18 Q 4 -22 6 -16 Q 2 -14 0 -18 Z" fill="#f3be29"/>
          <path d="M -7 -6 L 7 -6 L 7 2 C 7 7, 0 10, 0 10 C 0 10, -7 7, -7 2 Z" fill="#b71c1c" stroke="#131b26" stroke-width="1.2"/>
          <path d="M 0 -6 L 7 -6 L 7 2 C 7 7, 0 10, 0 10 Z" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- Animated Right Arm (Scratching Head Behind Cap - Anchored Inside Body) -->
    <g class="anim-scratch-arm">
      <!-- Sleeve & Arm -->
      <path class="uniform-navy" d="M 194 256 L 138 195 L 170 138 L 202 168 L 178 198 L 214 246 Z"/>
      
      <!-- Shoulder Epaulet -->
      <polygon points="172,256 204,248 214,264 182,270" class="uniform-navy"/>
      <line x1="178" y1="258" x2="200" y2="252" class="gold-stripe"/>
      <line x1="180" y1="264" x2="202" y2="258" class="gold-stripe"/>
      <line x1="182" y1="270" x2="204" y2="264" class="gold-stripe"/>
      
      <!-- Hand Scratching Head -->
      <path class="skin" d="M 170 138 C 164 122, 186 106, 202 120 C 208 126, 202 142, 192 148 Z"/>
      <!-- Fingers -->
      <path d="M 184 124 Q 192 116 198 124" fill="none" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 178 132 Q 186 124 192 132" fill="none" stroke="#2d1d17" stroke-width="2.2" stroke-linecap="round"/>
    </g>

  </g> <!-- End anim-body-idle -->
</svg>

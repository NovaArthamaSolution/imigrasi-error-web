<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <style>
<![CDATA[

      @keyframes cloudDrift1 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(10px); }
      }
      @keyframes cloudDrift2 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-12px); }
      }
      .anim-cloud-1 { animation: cloudDrift1 6.8s ease-in-out infinite; }
      .anim-cloud-2 { animation: cloudDrift2 8.2s ease-in-out infinite; }
      .anim-cloud-3 { animation: cloudDrift1 7.5s ease-in-out infinite; }
      .anim-cloud-4 { animation: cloudDrift2 9.0s ease-in-out infinite; }
      .anim-cloud-5 { animation: cloudDrift1 6.2s ease-in-out infinite; }
    
]]>
</style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Cloud 1: [LARGE - 1.25x] Fluffy Multi-Tiered Cumulus Giant (Upper Left) -->
  <g class="anim-cloud-1" opacity="0.94" transform="translate(10, -16) scale(1.25)">
    <path d="M 40 38 C 40 26 50 16 62 16 C 66 8 76 2 88 2 C 102 2 114 11 116 24 C 122 23 130 28 132 35 C 132 41 126 46 118 46 L 50 46 C 44 46 40 42 40 38 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Concentric Inner Highlight -->
    <path d="M 64 22 C 67 14 77 9 88 9 C 98 9 107 16 109 26" fill="none" stroke="#DBEAFE" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 52 38 L 110 38" stroke="#E2E8F0" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <!-- Trailing Wind Streaks -->
    <line x1="25" y1="44" x2="35" y2="44" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="14" y1="39" x2="28" y2="39" stroke="#BFDBFE" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Cloud 2: [SMALL - 0.75x] Stylized Mega Mendung Wave (RAISED MUCH HIGHER IN SKY) -->
  <g class="anim-cloud-2" opacity="0.88" transform="translate(245, -46) scale(0.75)">
    <!-- Base Cloud Wave -->
    <path d="M 230 32 C 230 24 238 18 248 18 C 252 10 262 6 274 6 C 288 6 298 14 302 22 C 308 16 320 16 328 22 C 334 26 334 32 328 36 C 322 36 312 36 242 36 C 235 36 230 34 230 32 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Concentric Ripples -->
    <path d="M 252 24 C 256 16 264 12 274 12 C 284 12 292 18 295 24" fill="none" stroke="#DBEAFE" stroke-width="2" stroke-linecap="round"/>
    <path d="M 264 24 C 267 18 270 16 274 16 C 278 16 282 18 284 24" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Decorative Accent Drops -->
    <circle cx="218" cy="32" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="210" cy="32" r="1.8" fill="#93C5FD" opacity="0.75"/>
  </g>

  <!-- Cloud 3: [MEDIUM - 1.05x] Modern Geometric Aero-Stratus with Streamers (Top Center High) -->
  <g class="anim-cloud-3" opacity="0.92" transform="translate(420, -18) scale(1.05)">
    <path d="M 530 32 C 522 32 516 26 516 20 C 516 13 522 8 530 8 C 534 8 538 10 542 13 C 548 6 558 2 570 2 C 584 2 596 11 598 23 C 604 22 612 27 612 33 C 612 38 606 42 598 42 L 536 42 C 532 42 530 37 530 32 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Modern Rib Arc -->
    <path d="M 548 18 C 554 10 562 6 572 6 C 582 6 590 12 593 20" fill="none" stroke="#DBEAFE" stroke-width="2" stroke-linecap="round"/>
    <!-- Streamer Dash -->
    <line x1="618" y1="33" x2="634" y2="33" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="622" y1="39" x2="630" y2="39" stroke="#BFDBFE" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Cloud 4: [MEDIUM-LARGE - 1.18x] Cirrocumulus Billow with Golden Sun-Glow (Mid-Right) -->
  <g class="anim-cloud-4" opacity="0.95" transform="translate(615, -12) scale(1.18)">
    <!-- Main Trio Cloud Body -->
    <path d="M 740 38 C 734 38 728 32 728 26 C 728 19 734 14 742 14 C 746 8 756 4 766 4 C 778 4 788 12 790 22 C 796 20 804 24 806 31 C 808 37 802 42 794 42 L 748 42 C 743 42 740 40 740 38 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Golden Sunlight Rim Accent -->
    <path d="M 750 12 C 754 8 760 6 766 6 C 774 6 782 11 784 18" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Companion Baby Puff & Star Dot -->
    <ellipse cx="818" cy="22" rx="7.5" ry="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="830" cy="20" r="2" fill="#60A5FA" opacity="0.8"/>
    <line x1="716" y1="36" x2="724" y2="36" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Cloud 5: [PETITE - 0.70x] Whimsical Mini Cirrus Duo (RAISED MUCH HIGHER IN TOP RIGHT) -->
  <g class="anim-cloud-5" opacity="0.85" transform="translate(800, -50) scale(0.70)">
    <path d="M 30 25 C 30 18 36 12 44 12 C 48 6 56 3 64 3 C 74 3 82 9 84 18 C 90 17 96 21 96 26 C 96 32 90 36 84 36 L 38 36 C 33 36 30 31 30 25 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <ellipse cx="110" cy="22" rx="8" ry="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="122" cy="20" r="2" fill="#38BDF8" opacity="0.85"/>
    <line x1="14" y1="34" x2="24" y2="34" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>

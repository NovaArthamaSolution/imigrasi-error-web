<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- 3D Sphere Yellow Gradient -->
    <radialGradient id="emojiBodyGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="45%" stop-color="#FFCA28" />
      <stop offset="85%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#F57C00" />
    </radialGradient>

    <!-- Drop Shadow for Emoji Face -->
    <filter id="emoji3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.32"/>
    </filter>
  </defs>

  <style>
<![CDATA[

  
    /* Emoji Floating Wobble Animation */
    .emoji-face-group {
      animation: emojiIdleWobble 3.5s ease-in-out infinite alternate;
      transform-origin: 65px 85px;
    }
    @keyframes emojiIdleWobble {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.03) translateY(-2px); }
      100% { transform: rotate(-4deg) scale(0.98) translateY(1px); }
    }

    /* Radiating Blue Energy Sparkles / Dashes Animation */
    .sparkle-dashes {
      animation: sparklePulse 1.8s ease-in-out infinite;
      transform-origin: 125px 45px;
    }
    @keyframes sparklePulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9) translate(0, 0); }
      50% { opacity: 1; transform: scale(1.12) translate(2px, -2px); }
    }

    /* Tongue Playful Wiggle */
    .anim-tongue {
      animation: tongueBob 1.6s ease-in-out infinite alternate;
      transform-origin: 65px 95px;
    }
    @keyframes tongueBob {
      0% { transform: rotate(-4deg) scaleY(1); }
      100% { transform: rotate(6deg) scaleY(1.08); }
    }

    /* Eyebrow and Eye Twitch */
    .eye-cross-l, .eye-cross-r {
      animation: crossBlink 3.2s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes crossBlink {
      0%, 92%, 100% { transform: scale(1); }
      96% { transform: scale(1.2) rotate(15deg); }
    }
  
  
]]>
</style>

  <!-- Radiating Blue Excitement/Dizzy Dashes (Top-Right) -->
  <g class="sparkle-dashes">
    <!-- Top-most dash -->
    <line x1="122" y1="28" x2="128" y2="16" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" />
    <!-- Middle dash -->
    <line x1="135" y1="42" x2="148" y2="35" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" />
    <!-- Bottom dash -->
    <line x1="140" y1="58" x2="152" y2="60" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Main Emoji Group -->
  <g class="emoji-face-group">
    <!-- Yellow Emoji Sphere -->
    <circle cx="65" cy="85" r="54" fill="url(#emojiBodyGrad)" filter="url(#emoji3DShadow)" />
    
    <!-- Top-Left Soft Highlight Arc -->
    <path d="M30 60 A45 45 0 0 1 85 40" stroke="#FFF9C4" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.45" />

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="28" cy="94" rx="9" ry="5.5" fill="#FF5722" opacity="0.4" />
    <ellipse cx="102" cy="94" rx="9" ry="5.5" fill="#FF5722" opacity="0.4" />

    <!-- Thin Curved Black Eyebrows -->
    <path d="M34 62 Q45 56 54 64" stroke="#261A05" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M76 64 Q85 56 96 62" stroke="#261A05" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Left Eye 'X' -->
    <g class="eye-cross-l" stroke="#211404" stroke-width="6.5" stroke-linecap="round">
      <line x1="36" y1="70" x2="52" y2="86" />
      <line x1="52" y1="70" x2="36" y2="86" />
    </g>

    <!-- Right Eye 'X' -->
    <g class="eye-cross-r" stroke="#211404" stroke-width="6.5" stroke-linecap="round">
      <line x1="78" y1="70" x2="94" y2="86" />
      <line x1="94" y1="70" x2="78" y2="86" />
    </g>

    <!-- Big Open Smiling Mouth -->
    <path d="M42 98 Q65 118 88 98 Q65 92 42 98 Z" fill="#211404" stroke="#211404" stroke-width="2" stroke-linejoin="round" />

    <!-- Long Red Tongue Sticking Down (Animated) -->
    <g class="anim-tongue">
      <!-- Tongue Shape -->
      <path d="M54 100 C54 110 55 125 65 125 C75 125 76 110 76 100 Z" fill="#EF4444" stroke="#211404" stroke-width="2.5" />
      <!-- Center Crease on Tongue -->
      <line x1="65" y1="102" x2="65" y2="120" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>

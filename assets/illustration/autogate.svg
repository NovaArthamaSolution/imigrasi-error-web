<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
<![CDATA[

      /* Metal and Structure Gradients */
      .gate-body { fill: url(#metallic-grad); stroke: #7d8b9b; stroke-width: 2.5; }
      .gate-inner { fill: #c0cbd6; stroke: #8090a0; stroke-width: 2; }
      .gate-pillar { fill: url(#pillar-grad); stroke: #5b6978; stroke-width: 2; }
      .gate-top-bevel { fill: #dae3eb; stroke: #99a8b8; stroke-width: 2; }
      .base-shadow { fill: #2c3e55; opacity: 0.18; filter: blur(6px); }

      /* Glass Wings */
      .glass-wing { fill: #eaf3fc; fill-opacity: 0.55; stroke: #b0cbe6; stroke-width: 2; rx: 12; }
      .glass-red-strip { stroke: #ea3323; stroke-width: 4; stroke-linecap: round; }

      /* Animations */
      .anim-left-wing {
        transform-origin: 220px 240px;
        animation: openLeftWing 4s ease-in-out infinite;
      }
      .anim-right-wing {
        transform-origin: 680px 240px;
        animation: openRightWing 4s ease-in-out infinite;
      }
      .anim-alarm-light {
        animation: alarmFlash 4s infinite;
      }
      .anim-led-screen {
        animation: ledSwitch 4s infinite;
      }

      @keyframes openLeftWing {
        0%, 35%, 100% { transform: scaleX(1); }
        48%, 78% { transform: scaleX(0.12) skewY(-8deg); }
      }

      @keyframes openRightWing {
        0%, 35%, 100% { transform: scaleX(1); }
        48%, 78% { transform: scaleX(0.12) skewY(8deg); }
      }

      @keyframes alarmFlash {
        0%, 40%, 80%, 100% { fill: #ef4444; filter: drop-shadow(0 0 2px #ef4444); }
        50%, 70% { fill: #22c55e; filter: drop-shadow(0 0 10px #22c55e); }
      }

      @keyframes ledSwitch {
        0%, 40%, 80%, 100% { fill: #06b6d4; }
        50%, 70% { fill: #22c55e; filter: drop-shadow(0 0 6px #22c55e); }
      }
    
]]>
</style>

    <linearGradient id="metallic-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6c2cf"/>
      <stop offset="25%" stop-color="#edf2f7"/>
      <stop offset="60%" stop-color="#c5d0dc"/>
      <stop offset="100%" stop-color="#8e9dae"/>
    </linearGradient>

    <linearGradient id="pillar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a6878"/>
      <stop offset="40%" stop-color="#9eb0c2"/>
      <stop offset="70%" stop-color="#647384"/>
      <stop offset="100%" stop-color="#3d4956"/>
    </linearGradient>
  </defs>

  <!-- Shadows -->
  <ellipse cx="160" cy="460" rx="90" ry="20" class="base-shadow"/>
  <ellipse cx="740" cy="460" rx="90" ry="20" class="base-shadow"/>

  <!-- Left Turnstile Barrier -->
  <g id="left-turnstile">
    <path class="gate-body" d="M 85 105 C 85 90, 120 75, 160 75 C 205 75, 240 90, 240 105 L 240 435 C 240 455, 205 465, 160 465 C 115 465, 85 455, 85 435 Z"/>
    <path class="gate-inner" d="M 150 145 L 220 125 L 220 405 L 150 425 Z"/>

    <rect x="188" y="130" width="16" height="280" rx="6" class="gate-pillar"/>
    <rect x="184" y="165" width="24" height="18" rx="3" class="gate-top-bevel"/>
    <rect x="184" y="325" width="24" height="18" rx="3" class="gate-top-bevel"/>

    <path class="gate-top-bevel" d="M 85 105 C 85 92, 120 78, 160 78 C 200 78, 235 92, 235 105 L 230 115 C 230 115, 195 100, 160 100 C 125 100, 90 115, 90 115 Z"/>
    
    <path d="M 86 112 C 100 118, 135 125, 162 125" fill="none" class="anim-led-screen" stroke-width="4.5" stroke-linecap="round"/>
    
    <rect x="100" y="86" width="38" height="16" rx="4" fill="#1e293b"/>
    <circle cx="119" cy="94" r="5" class="anim-led-screen"/>

    <path d="M 188 52 C 188 40, 208 40, 208 52 Z" class="anim-alarm-light"/>
    <rect x="186" y="52" width="24" height="6" rx="2" fill="#5b6978"/>
  </g>

  <!-- Right Turnstile Barrier -->
  <g id="right-turnstile">
    <path class="gate-body" d="M 660 105 C 660 90, 695 75, 740 75 C 785 75, 815 90, 815 105 L 815 435 C 815 455, 785 465, 740 465 C 695 465, 660 455, 660 435 Z"/>
    <path class="gate-inner" d="M 680 125 L 750 145 L 750 425 L 680 405 Z"/>

    <rect x="696" y="130" width="16" height="280" rx="6" class="gate-pillar"/>
    <rect x="692" y="165" width="24" height="18" rx="3" class="gate-top-bevel"/>
    <rect x="692" y="325" width="24" height="18" rx="3" class="gate-top-bevel"/>

    <path class="gate-top-bevel" d="M 665 105 C 665 92, 700 78, 740 78 C 780 78, 815 92, 815 105 L 810 115 C 810 115, 775 100, 740 100 C 705 100, 670 115, 670 115 Z"/>
    
    <path d="M 738 125 C 765 125, 800 118, 814 112" fill="none" class="anim-led-screen" stroke-width="4.5" stroke-linecap="round"/>
    
    <rect x="762" y="86" width="38" height="16" rx="4" fill="#1e293b"/>
    <circle cx="781" cy="94" r="5" class="anim-led-screen"/>

    <path d="M 692 52 C 692 40, 712 40, 712 52 Z" class="anim-alarm-light"/>
    <rect x="690" y="52" width="24" height="6" rx="2" fill="#5b6978"/>
  </g>

  <!-- Left Glass Wing -->
  <g class="anim-left-wing">
    <rect x="220" y="120" width="220" height="200" class="glass-wing"/>
    <line x1="230" y1="180" x2="430" y2="180" class="glass-red-strip"/>
    <path d="M 230 130 L 320 130 L 250 310 L 230 310 Z" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Right Glass Wing -->
  <g class="anim-right-wing">
    <rect x="460" y="120" width="220" height="200" class="glass-wing"/>
    <line x1="470" y1="180" x2="670" y2="180" class="glass-red-strip"/>
    <path d="M 470 130 L 560 130 L 490 310 L 470 310 Z" fill="#ffffff" fill-opacity="0.2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="garudaGold" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
<![CDATA[

  
    .glow-ring {
      animation: rotateRing 20s linear infinite;
      transform-origin: center;
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .garuda-emblem {
      transition: transform 0.3s ease;
    }
    svg:hover .garuda-emblem {
      transform: scale(1.05);
      transform-origin: center;
    }
  
  
]]>
</style>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#FFFDF8" stroke="#E5B84B" stroke-width="2.5" />
  <circle class="glow-ring" cx="50" cy="50" r="40" fill="none" stroke="#F59E0B" stroke-dasharray="3 3" stroke-width="1.5" opacity="0.7"/>

  <!-- Garuda Figure -->
  <g class="garuda-emblem" filter="url(#goldGlow)">
    <!-- Outer Wings -->
    <path d="M50 30 C36 14, 12 26, 14 48 C16 64, 32 70, 50 80 C68 70, 84 64, 86 48 C88 26, 64 14, 50 30 Z" fill="url(#garudaGold)" />
    <!-- Inner Wing Layer -->
    <path d="M50 36 C40 24, 22 32, 24 48 C26 58, 38 64, 50 72 C62 64, 74 58, 76 48 C78 32, 60 24, 50 36 Z" fill="#FDE68A" />
    
    <!-- Garuda Head and Beak -->
    <path d="M50 18 C46 18, 44 22, 45 27 C46 31, 48 34, 50 37 C52 34, 54 31, 55 27 C56 22, 54 18, 50 18 Z" fill="#B45309" />
    <polygon points="50,25 42,28 50,31" fill="#78350F" />
    
    <!-- Chest Shield -->
    <rect x="42" y="42" width="16" height="20" rx="3" fill="#DC2626" stroke="#991B1B" stroke-width="1.2" />
    <rect x="50" y="42" width="8" height="20" rx="1" fill="#FFFFFF" />
    <path d="M42 52 H58" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Center Star -->
    <polygon points="50,46 51.5,49.5 55,50 52.5,52.5 53,56 50,54 47,56 47.5,52.5 45,50 48.5,49.5" fill="#FBBF24" />

    <!-- Tail Feathers -->
    <path d="M46 78 L43 88 L50 85 L57 88 L54 78 Z" fill="#92400E" />
    <!-- Semboyan Scroll -->
    <path d="M28 85 Q50 81 72 85 Q50 89 28 85 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
  </g>
</svg>

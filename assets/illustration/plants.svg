<svg width="680" height="200" viewBox="0 0 680 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft translucent botanical gradients -->
    <linearGradient id="leafTranslucent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="leafTranslucent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="leafTranslucent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="flowerPetalSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- LEFT CLUSTER -->
  <g id="plants-left" transform="translate(15, 25)">
    <path d="M 25 155 C 5 110 8 50 35 15 C 48 45 42 105 25 155 Z" fill="url(#leafTranslucent1)" opacity="0.85"/>
    <path d="M 35 15 C 36 60 32 110 25 155" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <path d="M 40 155 C 50 105 85 70 110 50 C 105 85 75 125 40 155 Z" fill="url(#leafTranslucent2)" opacity="0.75"/>
    <path d="M 110 50 C 85 80 60 120 40 155" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <path d="M 10 155 C -8 120 -2 80 20 50 C 30 80 25 120 10 155 Z" fill="url(#leafTranslucent3)" opacity="0.65"/>

    <path d="M 32 155 C 18 120 28 85 55 65 C 58 95 48 130 32 155 Z" fill="url(#leafTranslucent1)" opacity="0.8"/>
    <path d="M 20 155 C 2 130 10 100 32 80 C 36 105 30 132 20 155 Z" fill="url(#leafTranslucent2)" opacity="0.7"/>
    <path d="M 50 155 C 62 125 92 105 110 95 C 98 122 75 142 50 155 Z" fill="url(#leafTranslucent3)" opacity="0.75"/>

    <path d="M 15 155 C 2 135 10 115 28 100 C 30 120 24 140 15 155 Z" fill="url(#leafTranslucent1)" opacity="0.85"/>
    <path d="M 38 155 C 48 132 68 122 82 118 C 72 136 58 148 38 155 Z" fill="url(#leafTranslucent2)" opacity="0.85"/>

    <!-- Flowers -->
    <g transform="translate(50, 75) scale(0.85)">
      <circle cx="-8" cy="0" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="8" cy="0" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="-8" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="8" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="-5.5" cy="-5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="5.5" cy="-5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="-5.5" cy="5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="5.5" cy="5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="0" r="3.8" fill="#FBBF24" opacity="0.9"/>
    </g>

    <g transform="translate(85, 105) scale(0.65)">
      <circle cx="-7" cy="0" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="7" cy="0" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="-7" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="7" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="0" r="3.2" fill="#FBBF24" opacity="0.9"/>
    </g>

    <g transform="translate(18, 90) scale(0.6)">
      <path d="M 0 8 C -6 0 0 -10 0 -10 C 0 -10 6 0 0 8 Z" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="1.5" r="2.8" fill="#FBBF24" opacity="0.85"/>
    </g>
  </g>

  <!-- RIGHT CLUSTER -->
  <g id="plants-right" transform="translate(555, 25)">
    <path d="M 85 155 C 105 110 102 50 75 15 C 62 45 68 105 85 155 Z" fill="url(#leafTranslucent1)" opacity="0.85"/>
    <path d="M 75 15 C 74 60 78 110 85 155" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <path d="M 70 155 C 60 105 25 70 0 50 C 5 85 35 125 70 155 Z" fill="url(#leafTranslucent2)" opacity="0.75"/>
    <path d="M 0 50 C 25 80 50 120 70 155" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <path d="M 100 155 C 118 120 112 80 90 50 C 80 80 85 120 100 155 Z" fill="url(#leafTranslucent3)" opacity="0.65"/>

    <path d="M 78 155 C 92 120 82 85 55 65 C 52 95 62 130 78 155 Z" fill="url(#leafTranslucent1)" opacity="0.8"/>
    <path d="M 90 155 C 108 130 100 100 78 80 C 74 105 80 132 90 155 Z" fill="url(#leafTranslucent2)" opacity="0.7"/>
    <path d="M 60 155 C 48 125 18 105 0 95 C 12 122 35 142 60 155 Z" fill="url(#leafTranslucent3)" opacity="0.75"/>

    <path d="M 95 155 C 108 135 100 115 82 100 C 80 120 86 140 95 155 Z" fill="url(#leafTranslucent1)" opacity="0.85"/>
    <path d="M 72 155 C 62 132 42 122 28 118 C 38 136 52 148 72 155 Z" fill="url(#leafTranslucent2)" opacity="0.85"/>

    <!-- Flowers -->
    <g transform="translate(60, 75) scale(0.85)">
      <circle cx="-8" cy="0" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="8" cy="0" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="-8" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="8" r="5.5" fill="url(#flowerPetalSoft)"/>
      <circle cx="-5.5" cy="-5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="5.5" cy="-5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="-5.5" cy="5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="5.5" cy="5.5" r="4.8" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="0" r="3.8" fill="#FBBF24" opacity="0.9"/>
    </g>

    <g transform="translate(25, 105) scale(0.65)">
      <circle cx="-7" cy="0" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="7" cy="0" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="-7" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="7" r="5" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="0" r="3.2" fill="#FBBF24" opacity="0.9"/>
    </g>

    <g transform="translate(92, 90) scale(0.6)">
      <path d="M 0 8 C -6 0 0 -10 0 -10 C 0 -10 6 0 0 8 Z" fill="url(#flowerPetalSoft)"/>
      <circle cx="0" cy="1.5" r="2.8" fill="#FBBF24" opacity="0.85"/>
    </g>
  </g>
</svg>

        <svg class="illustration-svg" viewBox="0 -100 900 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi Autogate Imigrasi Terkendala dan Paspor Indonesia">

              /* Keyframes for Synchronized Gate Scan Cycle */
              @keyframes floatScan {
                0%, 100% { transform: translateY(0px) scale(1); }

                55% { transform: translateY(-16px) scale(1.04); }
                80% { transform: translateY(0px) scale(1); }

              @keyframes openLeftWing {
                0%, 35%, 100% { transform: scaleX(1); }
                48%, 78% { transform: scaleX(0.12) skewY(-8deg); }

              @keyframes openRightWing {
                0%, 35%, 100% { transform: scaleX(1); }
                48%, 78% { transform: scaleX(0.12) skewY(8deg); }
              }

              @keyframes alarmFlash {
                0%, 40%, 80%, 100% { fill: #ef4444; filter: drop-shadow(0 0 2px #ef4444); }

              @keyframes ledSwitch {
                0%, 40%, 80%, 100% { fill: #06b6d4; }
                50%, 70% { fill: #22c55e; filter: drop-shadow(0 0 6px #22c55e); }

                0%, 25%, 75%, 100% { opacity: 0; transform: translateY(-40px); }

              .anim-sparkle-3 { animation: twinkleSparkleA 1.6s ease-in-out infinite 1.1s; transform-origin: 830px 84px; }
              .anim-sparkle-4 { animation: twinkleSparkleB 2.0s ease-in-out infinite 0.4s; transform-origin: 640px 48px; }
              .anim-sparkle-5 { animation: twinkleSparkleA 2.4s ease-in-out infinite 1.5s; transform-origin: 480px 39px; }

              /* Character Animations */
              @keyframes headScratch {
                0%, 100% { transform: rotate(0deg) translate(0px, 0px); }
                25% { transform: rotate(4deg) translate(2px, -3px); }
                50% { transform: rotate(-2deg) translate(-1px, 2px); }
                75% { transform: rotate(3deg) translate(3px, -2px); }
              }
              @keyframes hatWiggle {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(-1.5deg) translateY(-1px); }
                75% { transform: rotate(1deg) translateY(0.5px); }
              }
              @keyframes blink {
                0%, 92%, 100% { transform: scaleY(1); }
                96% { transform: scaleY(0.1); }

              @keyframes scratchMarks {
                0%, 100% { opacity: 0.2; transform: scale(0.9); }
                50% { opacity: 1; transform: scale(1.08); }
              }
              @keyframes breathe {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-2px); }
              }

              .arm-scratch {

                animation: headScratch 2.4s ease-in-out infinite;
              }
              .hat-group {
